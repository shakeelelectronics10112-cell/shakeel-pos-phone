<!doctype html>
<html lang="en">
<head>

<meta name="theme-color" content="#0f3d2c">

<title>Shakeel POS — Phone</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f3d2c'/%3E%3Ctext x='32' y='44' font-family='Arial' font-weight='900' font-size='34' text-anchor='middle' fill='%23f2c14e'%3ES%3C/text%3E%3C/svg%3E">
<style>:root{--g:#0f3d2c;--g2:#165a40;--gold:#f2c14e;--ink:#15201b;--ink2:#4c5a54;--ink3:#7f8c86;--line:#e1e7e4;--bg:#f2f5f3;--card:#fff;--red:#c2352b;--redbg:#fdecea;--amber:#a86400;--amberbg:#fff4e0;--green:#16794a;--greenbg:#e6f5ec;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
.hide{display:none!important}
.boot{display:flex;align-items:center;justify-content:center;height:100vh;color:var(--ink3)}
/* top bar */
.top{position:sticky;top:0;z-index:5;background:var(--g);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 12px 10px 16px;display:flex;align-items:center;gap:8px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.top .t{flex:1;min-width:0}
.top .shop{font-weight:800;font-size:17px;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .st{font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .st.bad{color:#ffb4ab;opacity:1}
.ib{background:rgba(255,255,255,.12);border:0;color:#fff;width:40px;height:40px;border-radius:12px;font-size:18px;display:flex;align-items:center;justify-content:center}
.ib.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
main{padding:12px 12px calc(84px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;border:0;background:none;padding:8px 2px 9px;font-size:11px;font-weight:600;color:var(--ink3);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button .i{font-size:20px;line-height:1.1;filter:grayscale(1);opacity:.7}
.tabs button.on{color:var(--g)}.tabs button.on .i{filter:none;opacity:1}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:13px;letter-spacing:.8px;text-transform:uppercase;color:var(--ink2);display:flex;align-items:center;gap:8px}
.card h3 .grow{flex:1}
.h1{font-size:13px;font-weight:700;color:var(--ink2);margin:4px 2px 8px;letter-spacing:.6px;text-transform:uppercase}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px}
.k .l{font-size:12px;color:var(--ink3);font-weight:600}
.k .v{font-size:22px;font-weight:800;margin-top:2px;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k .s{font-size:12px;color:var(--ink3);margin-top:2px}
.k.hero{background:var(--g);border-color:var(--g);color:#fff}.k.hero .l,.k.hero .s{color:rgba(255,255,255,.75)}
.k.gold{background:#fff8e6;border-color:#f3dca0}
.pos{color:var(--green)}.neg{color:var(--red)}.amb{color:var(--amber)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.muted{color:var(--ink3)}.small{font-size:12.5px}.b{font-weight:700}
.link{display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid var(--line)}
.link:first-of-type{border-top:0}
.link .ic{font-size:22px;width:30px;text-align:center}
.link .ar{color:var(--ink3);font-size:18px}
/* lists */
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;align-items:center;gap:10px;padding:11px 13px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .sub{font-size:12.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .r{text-align:right;flex-shrink:0}
.li .q{font-size:19px;font-weight:800}
.li.tap:active{background:#f3f6f4}
.empty{padding:28px 14px;text-align:center;color:var(--ink3)}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:#eef2f0;color:var(--ink2);vertical-align:1px}
.badge.r{background:var(--redbg);color:var(--red)}.badge.a{background:var(--amberbg);color:var(--amber)}.badge.g{background:var(--greenbg);color:var(--green)}.badge.d{background:#222;color:#fff}
/* inputs */
.in{width:100%;border:1px solid #cfd8d3;border-radius:12px;padding:11px 13px;background:#fff;outline:none;font-size:16px}
.in:focus{border-color:var(--g2);box-shadow:0 0 0 3px rgba(22,90,64,.12)}
.search{position:sticky;top:calc(62px + env(safe-area-inset-top));z-index:3;background:var(--bg);padding:2px 0 10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;white-space:nowrap;color:var(--ink2)}
.chip.on{background:var(--g);border-color:var(--g);color:#fff}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;background:#e9eeeb;color:var(--ink)}
.btn.pri{background:var(--g);color:#fff}.btn.gold{background:var(--gold);color:#3a2a00}.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}.btn.full{width:100%}
.btn:disabled{opacity:.55}
/* reminders */
.nt{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.nt:first-child{border-top:0}
.nt input{width:22px;height:22px;margin-top:1px;flex-shrink:0;accent-color:var(--g)}

/* report rows */

.rr:first-child{border-top:0}
.rr.big{font-size:17px;font-weight:800}
.rr .v{font-weight:700;white-space:nowrap}
/* bottom sheet */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,20,15,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .pn{background:#fff;width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));animation:up .18s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:#d5dcd8;margin:4px auto 10px}

.sheet .tbl{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
.sheet .tbl td{padding:7px 0;border-top:1px solid var(--line);vertical-align:top}
.sheet .tbl td.n{text-align:right;white-space:nowrap;padding-left:10px}
.sheet .tbl tr.tot td{font-weight:800;border-top:2px solid var(--ink)}
.place{display:flex;justify-content:space-between;padding:9px 12px;border:1px solid var(--line);border-radius:12px;margin-top:6px}
.place b{font-size:17px}
/* login */
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px 20px calc(24px + env(safe-area-inset-bottom));max-width:440px;margin:0 auto}
.login .logo{width:64px;height:64px;border-radius:18px;background:var(--g);color:var(--gold);font-weight:900;font-size:34px;display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.login h1{margin:0 0 4px;font-size:24px}
.login p{color:var(--ink2);margin:0 0 18px}
.login label{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin:12px 0 6px}
.login .ok{background:var(--greenbg);color:var(--green);border-radius:12px;padding:10px 12px;font-weight:600;font-size:14px}
.login .err{background:var(--redbg);color:var(--red);border-radius:12px;padding:10px 12px;font-weight:600;font-size:14px;margin-top:12px}
.banner{border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px;background:var(--amberbg);color:#6b4300;font-weight:600}
.banner.r{background:var(--redbg);color:var(--red)}
/* toasts */
#toasts{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:30;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:#1d2a24;color:#fff;border-radius:12px;padding:11px 15px;font-weight:600;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:520px}
.toast.err{background:var(--red)}
.menu{position:absolute;right:10px;top:calc(56px + env(safe-area-inset-top));background:#fff;color:var(--ink);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.2);overflow:hidden;z-index:10;min-width:220px}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:13px 16px;font-weight:600;border-top:1px solid var(--line)}
.menu button:first-child{border-top:0}
.menu .dan{color:var(--red)}
</style>

<body>
<div id="app"><div class="boot">Loading…</div></div>
<div id="sheet" class="sheet hide"></div>
<div id="toasts"></div>
<script>'use strict';
/* ================= Shakeel POS — core ================= */
const APP = { name: 'Shakeel POS', ver: '2.0.0', dbName: 'ShakeelPOS', dbVer: 2, sig: 'ShakeelPOS' };
const STORES = ['items', 'customers', 'sales', 'returns', 'moves', 'stockins', 'payments', 'expenses', 'holds', 'parcels'];

/* ---------- small helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let _seq = 0;
const uid = () => Date.now().toString(36) + (++_seq % 1296).toString(36).padStart(2, '0') + Math.random().toString(36).slice(2, 9);
const r2 = n => Math.round(((+n) || 0) * 100) / 100;
const num = v => { const n = parseFloat(String(v ?? '').replace(/[, ]/g, '')); return isFinite(n) ? n : 0; };
function fmt(n) {
  n = r2(n); const neg = n < 0; const a = Math.abs(n);
  const s = a.toLocaleString('en-US', { minimumFractionDigits: a % 1 ? 2 : 0, maximumFractionDigits: 2 });
  return (neg ? '-' : '') + s;
}
const rs = n => 'Rs ' + fmt(n);
const rs0 = n => 'Rs ' + Math.round(+n || 0).toLocaleString('en-US'); // whole rupees for big summary numbers
const qf = n => fmt(n); // quantity
const pad = n => String(n).padStart(2, '0');
function dayKey(ts = Date.now()) { const d = new Date(ts); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function keyToDate(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(k, n) { const d = keyToDate(k); d.setDate(d.getDate() + n); return dayKey(d.getTime()); }
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function fmtDate(ts) { const d = typeof ts === 'string' ? keyToDate(ts) : new Date(ts); return pad(d.getDate()) + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear(); }
function fmtTime(ts) { const d = new Date(ts); let h = d.getHours(); const ap = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12; return h + ':' + pad(d.getMinutes()) + ' ' + ap; }
const fmtDT = ts => fmtDate(ts) + ', ' + fmtTime(ts);
function tsFromKey(k, refTs) { // keep time-of-day, change the date
  const d = keyToDate(k); const r = new Date(refTs || Date.now()); d.setHours(r.getHours(), r.getMinutes(), r.getSeconds(), r.getMilliseconds()); return d.getTime();
}
const lc = s => String(s || '').toLowerCase();
function waPhone(p) {
  let d = String(p || '').replace(/\D/g, '');
  if (!d) return '';
  if (d.startsWith('0092')) d = d.slice(2);
  if (d.length === 11 && d.startsWith('0')) d = '92' + d.slice(1);
  if (d.length === 10 && d.startsWith('3')) d = '92' + d;
  return d;
}
function openWA(phone, text) {
  const p = waPhone(phone);
  if (S.settings && S.settings.waApp) { // straight into the WhatsApp Desktop app
    const a = document.createElement('a'); a.href = 'whatsapp://send?' + (p ? 'phone=' + p + '&' : '') + 'text=' + encodeURIComponent(text);
    document.body.appendChild(a); a.click(); a.remove(); return;
  }
  window.open('https://wa.me/' + (p || '') + '?text=' + encodeURIComponent(text), '_blank');
}
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

/* ---------- database (IndexedDB) ---------- */
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const rq = indexedDB.open(APP.dbName, APP.dbVer);
      rq.onupgradeneeded = () => {
        const db = rq.result;
        if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'k' });
        for (const s of STORES) if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath: 'id' });
      };
      rq.onsuccess = () => {
        this.db = rq.result;
        this.db.onversionchange = () => { this.db.close(); alert('Shakeel POS was updated in another window. Please reload this page.'); };
        res(this.db);
      };
      rq.onerror = () => rej(rq.error);
      rq.onblocked = () => rej(new Error('Database is blocked by another open window. Close other Shakeel POS windows and reload.'));
    });
  },
  all(store) {
    return new Promise((res, rej) => {
      const rq = this.db.transaction(store, 'readonly').objectStore(store).getAll();
      rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error);
    });
  },
  /* ops: [{s, put}|{s, del}|{s, clear:true}] — ONE transaction: everything is saved, or nothing is */
  write(ops) {
    return new Promise((res, rej) => {
      const names = [...new Set(ops.map(o => o.s))];
      if (!names.length) return res();
      let t;
      try { t = this.db.transaction(names, 'readwrite', { durability: 'strict' }); } catch (e) { return rej(e); }
      try {
        for (const o of ops) {
          const st = t.objectStore(o.s);
          if (o.clear) st.clear(); else if (o.del !== undefined) st.delete(o.del); else st.put(o.put);
        }
      } catch (e) { try { t.abort(); } catch (_) { } return rej(e); }
      t.oncomplete = () => res();
      t.onerror = () => rej(t.error || new Error('Save failed'));
      t.onabort = () => rej(t.error || new Error('Save was cancelled'));
    });
  }
};

/* ---------- state ---------- */
const S = {
  settings: null, counters: null, backup: {}, dir: null,
  items: new Map(), customers: new Map(), sales: new Map(), returns: new Map(), moves: new Map(),
  stockins: new Map(), payments: new Map(), expenses: new Map(), holds: new Map(), parcels: new Map(),
  ix: { retBySale: new Map(), lastPrice: new Map() }
};
const DEFAULT_CATS = ['TCON Board', 'COF / TAB IC', 'Main Board / Scaler', 'LVDS Cable', 'ACF Tape', 'Backlight Strip', 'Power Board', 'Remote', 'Panel / Display', 'Tools', 'Other'];
const EXP_CATS = ['Rent', 'Electricity', 'Salary', 'Tea / Food', 'Transport', 'Courier', 'Mobile / Internet', 'Repair', 'Packing', 'Other'];
function defaultSettings() {
  return {
    shop: 'SHAKEEL ELECTRONICS', tagline: 'YOUR TRUSTED ELECTRONICS PARTNER', address: 'Faisalabad, Pakistan', phone: '',
    footer: 'Thank you for your business!', accounts: '', logo: '',
    paper: '80', receiptFont: 12, printAfterSave: true, showBalanceOnReceipt: true, receiptBold: true,
    allowNegative: false, lowDefault: 3, waApp: false,
    courier: 'TCS', shipSize: '4x6', itemSize: '3x1in', boxSize: '3x1in', sizesV2: true, locV2: true, reserveBoxes: null, labelPrice: false, shipCOD: false, shipCN: false, courierAccounts: { TCS: '' }, trackLinks: { TCS: 'https://www.tcsexpress.com/track/{cn}' }, dealerAuto: true, pinHash: '', showCost: false,
    categories: DEFAULT_CATS.slice(), expenseCats: EXP_CATS.slice(), started: Date.now()
  };
}
const defaultCounters = () => ({ bill: 1000, ret: 0, sin: 0, pay: 0, parcel: 0, sku: 0 });

async function loadAll() {
  for (const s of STORES) { const rows = await DB.all(s); S[s] = new Map(rows.map(r => [r.id, r])); }
  const meta = await DB.all('meta');
  const m = Object.fromEntries(meta.map(x => [x.k, x.v]));
  S.settings = Object.assign(defaultSettings(), m.settings || {});
  S.counters = Object.assign(defaultCounters(), m.counters || {});
  S.backup = m.backup || {};
  S.dir = m.dir || null;
  S.notes = Array.isArray(m.notes) ? m.notes : []; // parcel reminders
  S.isNew = !m.settings;
  S.oldSizes = !!m.settings && !m.settings.sizesV2;
  S.oldLoc = !!m.settings && !m.settings.locV2; // items made before main box / sub box / reserve boxes // shop made before 3x1 inch stickers / 4x6 inch parcels became the sizes
  rebuildIndexes();
}
function rebuildIndexes() {
  const rb = new Map();
  for (const r of S.returns.values()) { if (!rb.has(r.saleId)) rb.set(r.saleId, []); rb.get(r.saleId).push(r); }
  for (const a of rb.values()) a.sort((x, y) => x.ts - y.ts);
  const lp = new Map();
  const sales = [...S.sales.values()].filter(s => !s.void && s.custId).sort((a, b) => a.ts - b.ts);
  for (const s of sales) for (const l of s.lines) if (l.itemId) lp.set(s.custId + '|' + l.itemId, { price: l.price, ts: s.ts, no: s.no });
  S.ix = { retBySale: rb, lastPrice: lp };
}

/* every change goes through this queue: one at a time, atomic, memory updated only after the disk says OK */
let _q = Promise.resolve();
const Bus = { subs: [], on(fn) { this.subs.push(fn); }, emit(ops) { for (const f of this.subs) try { f(ops); } catch (e) { console.error(e); } } };
function commit(build) { // build() returns ops[] or {ops, ...anything}; resolves with what build returned
  const p = _q.then(async () => {
    const r = await build();
    const ops = Array.isArray(r) ? r : (r && r.ops) || [];
    if (!ops.length) return r;
    await DB.write(ops);
    applyOps(ops);
    Bus.emit(ops);
    return r;
  });
  _q = p.catch(() => { });
  return p;
}
function applyOps(ops) {
  for (const o of ops) {
    if (o.s === 'meta') {
      const k = o.put.k, v = o.put.v;
      if (k === 'settings') S.settings = v; else if (k === 'counters') S.counters = v; else if (k === 'backup') S.backup = v; else if (k === 'dir') S.dir = v; else if (k === 'notes') S.notes = v;
      continue;
    }
    const m = S[o.s];
    if (o.clear) m.clear(); else if (o.del !== undefined) m.delete(o.del); else m.set(o.put.id, o.put);
  }
  rebuildIndexes();
}
const metaPut = (k, v) => ({ s: 'meta', put: { k, v } });
function saveSettings(patch) {
  return commit(() => [metaPut('settings', Object.assign({}, S.settings, patch))]);
}

/* ---------- single window guard ---------- */
function singleWindow() {
  if (!navigator.locks) return Promise.resolve(true);
  return new Promise(res => {
    navigator.locks.request('shakeelpos-main-window', { ifAvailable: true }, lock => {
      if (!lock) { res(false); return; }
      res(true);
      return new Promise(() => { }); // hold the lock while this window is open
    }).catch(() => res(true));
  });
}

/* ---------- owner PIN ---------- */
async function hashPin(pin) {
  const txt = 'shakeelpos::' + pin;
  try {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
  } catch (e) { let h = 5381; for (const c of txt) h = ((h << 5) + h + c.charCodeAt(0)) | 0; return 'd' + (h >>> 0).toString(16); }
}
const Owner = {
  unlocked: false,
  get on() { return !S.settings.pinHash || this.unlocked; },
  async ask(why) {
    if (this.on) return true;
    const pin = await UI.prompt('Owner PIN', why || 'Enter the owner PIN', { type: 'password', ok: 'Unlock' });
    if (pin == null) return false;
    if (await hashPin(pin) === S.settings.pinHash) { this.unlocked = true; App.chrome(); App.refresh(true); toast('Unlocked'); return true; }
    toast('Wrong PIN', 'err'); return false;
  },
  lock() { this.unlocked = false; App.chrome(); App.refresh(true); toast('Locked — cost and profit are hidden'); }
};

/* ---------- backup ---------- */
const Backup = {
  timer: null, state: 'idle', err: '', dirty: false, ver: 0, busy: false, lastWrite: 0,
  GAP: 3 * 60e3, // at most one folder write every 3 minutes (keeps cloud uploads light); the PC's own copy is saved instantly anyway
  supported: typeof window.showDirectoryPicker === 'function',
  schedule() {
    this.dirty = true; this.ver++;
    if (this.timer) return;
    const wait = Math.max(4000, this.lastWrite + this.GAP - Date.now());
    this.timer = setTimeout(() => { this.timer = null; this.auto(); }, wait);
  },
  flush() { if (this.dirty && S.dir && this.state === 'ok') { clearTimeout(this.timer); this.timer = null; this.auto(); } },
  snapshot() {
    const o = { app: APP.sig, ver: APP.ver, schema: 1, at: Date.now(), settings: S.settings, counters: S.counters, notes: S.notes || [] };
    for (const s of STORES) o[s] = [...S[s].values()];
    return o;
  },
  async permission(ask) {
    if (!S.dir) return 'none';
    try {
      let p = await S.dir.queryPermission({ mode: 'readwrite' });
      if (p !== 'granted' && ask) p = await S.dir.requestPermission({ mode: 'readwrite' });
      return p;
    } catch (e) { return 'error'; }
  },
  async auto() {
    if (!S.dir) { this.state = 'nofolder'; App.chrome(); return; }
    const p = await this.permission(false);
    if (p !== 'granted') { this.state = 'needperm'; App.chrome(); return; }
    try { await this.toFolder(); } catch (e) { this.state = 'error'; this.err = e.message || String(e); App.chrome(); }
  },
  async gzip(text) {
    if (typeof CompressionStream === 'undefined') return null;
    return await new Response(new Blob([text]).stream().pipeThrough(new CompressionStream('gzip'))).blob();
  },
  async writeFile(name, data) {
    const fh = await S.dir.getFileHandle(name, { create: true });
    const w = await fh.createWritable(); // writes to a temp copy, swapped in only when complete
    await w.write(data); await w.close();
  },
  async toFolder(extraName) {
    if (this.busy) { this.dirty = true; return; }
    this.busy = true; const startVer = this.ver;
    try {
      const json = JSON.stringify(this.snapshot());
      const gz = await this.gzip(json); // ~10x smaller = quick uploads to Google Drive / OneDrive
      const ext = gz ? '.json.gz' : '.json', data = gz || json;
      await this.writeFile('ShakeelPOS-latest' + ext, data);
      await this.writeFile('ShakeelPOS-' + dayKey() + ext, data);
      if (extraName) await this.writeFile(extraName + ext, data);
      if (gz) { try { await S.dir.removeEntry('ShakeelPOS-latest.json'); } catch (e) { } } // no stale uncompressed copy
      this.lastWrite = Date.now();
      await this.mark({ last: this.lastWrite, lastFolder: this.lastWrite, lastSize: gz ? gz.size : json.length });
      this.state = 'ok'; this.err = '';
      if (this.ver === startVer) this.dirty = false; else this.schedule(); // something changed while writing
      this.prune();
    } finally { this.busy = false; App.chrome(); }
  },
  async prune() { // keep every day for 60 days, and the 1st of every month for ever
    const today = dayKey(); if (S.backup.pruned === today || !S.dir || !S.dir.entries) return;
    try {
      const cut = addDays(today, -60), old = [];
      for await (const [name] of S.dir.entries()) {
        const m = /^ShakeelPOS-(\d{4}-\d{2}-\d{2})\.json(\.gz)?$/.exec(name);
        if (m && m[1] < cut && m[1].slice(8) !== '01') old.push(name);
      }
      for (const n of old) await S.dir.removeEntry(n);
      await this.mark({ pruned: today });
    } catch (e) { console.warn('prune', e); }
  },
  async mark(patch) {
    const v = Object.assign({}, S.backup, patch);
    try { await DB.write([metaPut('backup', v)]); S.backup = v; } catch (e) { console.warn(e); }
  },
  download(tag) {
    const json = JSON.stringify(this.snapshot(), null, 0);
    const d = new Date();
    const name = 'ShakeelPOS-backup-' + dayKey() + '-' + pad(d.getHours()) + pad(d.getMinutes()) + (tag ? '-' + tag : '') + '.json';
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
    a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    this.mark({ last: Date.now(), lastDownload: Date.now() }).then(() => App.chrome());
    return name;
  },
  async chooseFolder() {
    if (!this.supported) { toast('This browser cannot save to a folder. Use Chrome or Edge, or use "Download backup".', 'warn'); return; }
    try {
      const h = await window.showDirectoryPicker({ id: 'shakeelpos-backup', mode: 'readwrite', startIn: 'documents' });
      await DB.write([metaPut('dir', h)]); S.dir = h;
      await this.mark({ folderName: h.name });
      await this.toFolder();
      toast('Auto-backup is ON → folder "' + h.name + '"');
    } catch (e) { if (e && e.name !== 'AbortError') toast('Could not use that folder: ' + e.message, 'err'); }
    App.chrome(); App.refresh(true);
  },
  async reconnect() {
    const p = await this.permission(true);
    if (p === 'granted') { try { await this.toFolder(); toast('Auto-backup reconnected'); } catch (e) { toast('Backup failed: ' + e.message, 'err'); } }
    else toast('Permission not given — auto-backup is paused', 'warn');
    App.chrome(); App.refresh(true);
  },
  status() {
    const last = S.backup.last || 0; const age = Date.now() - last;
    if (S.dir && this.state === 'ok') return { cls: 'ok', text: 'Auto-backup ON', tip: 'Last saved to folder "' + (S.backup.folderName || (S.dir && S.dir.name) || '') + '" at ' + fmtTime(S.backup.lastFolder) + (this.dirty ? ' — new changes will be saved within 3 minutes' : ' — up to date') };
    if (S.dir && this.state === 'needperm') return { cls: 'bad', text: 'Click to turn on backup', tip: 'The browser needs your OK once to keep saving backups to your folder' };
    if (S.dir && this.state === 'error') return { cls: 'bad', text: 'Backup error', tip: this.err };
    if (!last) return { cls: 'bad', text: 'No backup yet', tip: 'Set up a backup folder in Settings' };
    if (age < 864e5) return { cls: 'ok', text: 'Backed up ' + fmtTime(last), tip: '' };
    if (age < 7 * 864e5) return { cls: 'warn', text: 'Backup ' + Math.floor(age / 864e5) + 'd old', tip: '' };
    return { cls: 'bad', text: 'Backup ' + Math.floor(age / 864e5) + 'd old', tip: '' };
  }
};
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') Backup.flush(); }); // window minimised/closing → save now
Bus.on(() => Backup.schedule());

async function readBackupFile(file) { // accepts .json and the compressed .json.gz written to the backup folder
  const buf = new Uint8Array(await file.arrayBuffer());
  if (buf[0] === 0x1f && buf[1] === 0x8b) {
    if (typeof DecompressionStream === 'undefined') throw new Error('This browser cannot open .gz backups. Use Chrome or Edge.');
    return JSON.parse(await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
  }
  return JSON.parse(new TextDecoder().decode(buf).replace(/^\ufeff/, ''));
}
function validateBackup(o) {
  if (!o || o.app !== APP.sig) return 'This is not a Shakeel POS backup file.';
  for (const s of ['items', 'customers', 'sales']) if (!Array.isArray(o[s])) return 'Backup file is incomplete (' + s + ' missing).';
  return '';
}
async function restoreBackup(o) {
  const ops = [];
  for (const s of STORES) ops.push({ s, clear: true });
  ops.push(metaPut('settings', Object.assign(defaultSettings(), o.settings || {})));
  ops.push(metaPut('counters', Object.assign(defaultCounters(), o.counters || {})));
  ops.push(metaPut('notes', Array.isArray(o.notes) ? o.notes : []));
  for (const s of STORES) for (const r of (o[s] || [])) if (r && r.id) ops.push({ s, put: r });
  await DB.write(ops); // all-or-nothing
}

/* ---------- draft (unsaved bill survives a crash/close) ---------- */
const Draft = {
  key: 'shakeelpos:draft',
  save(c) { try { if (c && c.lines.length) localStorage.setItem(this.key, JSON.stringify(c)); else localStorage.removeItem(this.key); } catch (e) { } },
  load() { try { return JSON.parse(localStorage.getItem(this.key) || 'null'); } catch (e) { return null; } },
  clear() { try { localStorage.removeItem(this.key); } catch (e) { } }
};

/* ---------- CSV ---------- */
function toCSV(rows) {
  return '﻿' + rows.map(r => r.map(v => {
    const s = v == null ? '' : String(v);
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(',')).join('\r\n');
}
function downloadText(name, text, type = 'text/csv') {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function parseCSV(text) {
  text = text.replace(/^﻿/, '');
  const first = text.split(/\r?\n/)[0] || '';
  const delim = (first.match(/\t/g) || []).length > (first.match(/,/g) || []).length ? '\t' : (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ';' : ',';
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === delim) { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(v => String(v).trim() !== ''));
}
function readFileText(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsText(file); }); }
function pickFile(accept) {
  return new Promise(res => {
    const i = document.createElement('input'); i.type = 'file'; i.accept = accept || '';
    i.onchange = () => res(i.files[0] || null); i.click();
  });
}

/* ================= Shakeel POS — business rules =================
   Every builder returns a list of database operations. They NEVER change S directly:
   memory is only updated after the whole set is safely on disk (see commit()). */

/* ---------- where an item is kept: main box + sub box, and optional reserve boxes with their own pieces ----------
   it.box / it.sub = main place;  it.res = [{box, sub, qty}] = reserve places;  it.qty = ALL pieces.
   Pieces in the main box = it.qty − reserve pieces. Selling takes from the main box first, then the reserve. */
const PLACE_SEP = ' › ';
const normText = s => String(s ?? '').replace(/\s+/g, ' ').trim();
const placeOf = (box, sub) => [normText(box), normText(sub)].filter(Boolean).join(PLACE_SEP);
function splitPlace(s) {
  s = normText(s); const m = s.match(/^(.*?)\s*(?:›|>)\s*(.+)$/);
  return m ? { box: m[1].trim(), sub: m[2].trim() } : { box: s, sub: '' };
}
const resList = it => (it && Array.isArray(it.res) ? it.res : []);
const resTotal = it => r2(resList(it).reduce((a, r) => a + num(r.qty), 0));
const mainQty = it => r2(num(it.qty) - resTotal(it));
const mainPlace = it => placeOf(it.box, it.sub);
function itemPlaces(it) {
  const out = [{ kind: 'main', idx: -1, place: mainPlace(it), qty: mainQty(it) }];
  resList(it).forEach((r, i) => out.push({ kind: 'res', idx: i, place: placeOf(r.box, r.sub), qty: r2(num(r.qty)) }));
  return out;
}
function placeText(it, withQty) {
  const m = mainPlace(it), rs = resList(it).filter(r => r.box || r.sub);
  if (!rs.length) return m;
  return (m || 'no main box') + (withQty ? ' (' + qf(mainQty(it)) + ')' : '') + ' · Reserve: ' + rs.map(r => placeOf(r.box, r.sub) + ' (' + qf(r.qty) + ')').join(', ');
}
function fixRes(it) { // reserve pieces can never be more than all pieces; take the difference out of the reserve
  const rs = resList(it).map(r => ({ box: normText(r.box), sub: normText(r.sub), qty: r2(Math.max(0, num(r.qty))) })).filter(r => r.box || r.sub || r.qty);
  let over = r2(rs.reduce((a, r) => a + r.qty, 0) - Math.max(0, num(it.qty)));
  for (let i = rs.length - 1; i >= 0 && over > 0; i--) { const t = Math.min(over, rs[i].qty); rs[i].qty = r2(rs[i].qty - t); over = r2(over - t); }
  it.res = rs;
  return it;
}
const putItem = it => ({ s: 'items', put: fixRes(it) });
function migrateLocations() { // older versions kept one text "Box" (and v1.7 joined places with " | ")
  const ops = [];
  for (const it0 of S.items.values()) {
    if (it0.sub !== undefined) continue;
    const it = { ...it0 }, parts = String(it.box || '').split(' | ').map(normText).filter(Boolean);
    const qmap = {}, mt = /Pieces by place: (.*)$/.exec(it.note || '');
    if (mt) for (const seg of mt[1].split(', ')) { const k = seg.lastIndexOf(' = '); if (k > 0) qmap[seg.slice(0, k)] = num(seg.slice(k + 3)); }
    let mi = parts.findIndex(pl => !RESERVE_GUESS.test(splitPlace(pl).box)); if (mi < 0) mi = 0;
    const mp = splitPlace(parts[mi] || '');
    it.box = mp.box; it.sub = mp.sub;
    it.res = parts.filter((_, i) => i !== mi).map(pl => ({ ...splitPlace(pl), qty: qmap[pl] || 0 }));
    if (mt) it.note = normText(String(it.note).replace(/\s*·?\s*Pieces by place: .*$/, ''));
    ops.push(putItem(it));
  }
  return ops;
}
const RESERVE_GUESS = /(plastic|disposable|catton|carton|cartoon|reserve|reel|godown|store ?room|extra)/i;
const needsRefill = it => it.active !== false && resTotal(it) > 0 && mainQty(it) <= lowLevel(it); // main box low, reserve has stock
const MOVE_LABEL = {
  open: 'Opening stock', in: 'Stock in', sale: 'Sold', return: 'Returned to stock', retdmg: 'Returned damaged (loss)',
  damage: 'Damaged / lost', adjust: 'Stock count', move: 'Moved between boxes', edit: 'Bill edited', void: 'Bill cancelled', price: 'Price changed', import: 'Imported'
};
const METHODS = { cash: 'Cash', easypaisa: 'Easypaisa', jazzcash: 'JazzCash', bank: 'Bank', account: 'Customer account' };
const CUST_TYPES = { retail: 'Retail', dealer: 'Dealer', tech: 'Technician' };
const usesDealer = c => !!c && (c.type === 'dealer' || c.type === 'tech');

function mv(ts, itemId, type, qty, extra) {
  return { s: 'moves', put: Object.assign({ id: uid(), ts, day: dayKey(ts), itemId, type, qty: r2(qty) }, extra) };
}
function addStock(it, q, cost) { // q > 0 → moving average cost
  const cur = num(it.qty), nq = r2(cur + q);
  if (cost > 0) it.cost = cur <= 0 || nq <= 0 ? r2(cost) : r2((cur * num(it.cost) + q * cost) / nq);
  it.qty = nq;
}
const itemOrFail = id => { const it = S.items.get(id); if (!it) throw new Error('An item on this bill no longer exists. Remove it and add again.'); return { ...it }; };

/* ---------- totals for a bill being made ---------- */
function cartTotals(c) {
  const lines = c.lines.map(l => ({ ...l, qty: r2(num(l.qty)), price: r2(num(l.price)) }));
  const sub = r2(lines.reduce((a, l) => a + l.qty * l.price, 0));
  let disc = c.discMode === '%' ? r2(sub * num(c.disc) / 100) : r2(num(c.disc));
  disc = Math.min(Math.max(disc, 0), sub);
  const deliv = r2(Math.max(0, num(c.deliv)));
  const total = r2(sub - disc + deliv);
  const tenderBlank = String(c.recv ?? '').trim() === '';
  const tender = tenderBlank ? total : r2(Math.max(0, num(c.recv)));
  const recv = r2(Math.min(tender, total));
  const change = r2(Math.max(0, tender - total));
  const credit = r2(total - recv);
  const qty = r2(lines.reduce((a, l) => a + l.qty, 0));
  return { lines, sub, disc, deliv, total, tender, recv, change, credit, tenderBlank, qty };
}
function allocDiscount(lines, sub, disc) {
  let lastPos = -1; lines.forEach((l, i) => { if (l.qty * l.price > 0) lastPos = i; });
  let left = disc;
  return lines.map((l, i) => {
    const amt = r2(l.qty * l.price);
    let share = sub > 0 && amt > 0 ? r2(disc * amt / sub) : 0;
    if (i === lastPos) share = r2(left);
    left = r2(left - share);
    const netAmt = r2(amt - share);
    return { ...l, amt, netAmt, net: l.qty ? netAmt / l.qty : 0 };
  });
}
function cleanLines(T, keepCostLines) {
  return allocDiscount(T.lines, T.sub, T.disc).map(l => {
    const it = l.itemId ? S.items.get(l.itemId) : null;
    const cost = l.keepCost ? r2(num(l.cost)) : it ? r2(num(it.cost)) : r2(num(l.cost));
    return { itemId: l.itemId || null, name: l.name, code: l.code || '', qty: l.qty, price: l.price, amt: l.amt, netAmt: l.netAmt, net: l.net, cost };
  });
}

/* ---------- sale ---------- */
function buildSale(cart, o = {}) {
  const T = cartTotals(cart);
  const ts = o.ts || Date.now(), day = dayKey(ts);
  const counters = { ...S.counters, bill: S.counters.bill + 1 };
  const no = counters.bill, id = uid();
  const cust = cart.custId ? S.customers.get(cart.custId) : null;
  const lines = cleanLines(T);
  const ops = [], items = new Map();
  for (const l of lines) {
    if (!l.itemId) continue;
    const it = items.get(l.itemId) || itemOrFail(l.itemId);
    it.qty = r2(num(it.qty) - l.qty); it.lastSold = ts; it.updated = ts;
    items.set(it.id, it);
    ops.push(mv(ts, it.id, 'sale', -l.qty, { cost: l.cost, price: r2(l.net), ref: 'Bill #' + no, refId: id, party: cust ? cust.name : 'Walk-in', after: it.qty }));
  }
  for (const it of items.values()) ops.push(putItem(it));
  const sale = {
    id, no, ts, day, custId: cust ? cust.id : null, custName: cust ? cust.name : 'Walk-in', custPhone: cust ? cust.phone || '' : '',
    lines, sub: T.sub, disc: T.disc, discLabel: cart.discMode === '%' && num(cart.disc) ? num(cart.disc) + '%' : '',
    deliv: T.deliv, total: T.total, tender: T.tender, recv: T.recv, change: T.change, credit: T.credit,
    method: cart.method || 'cash', note: (cart.note || '').trim(),
    prevBal: cust ? custBalance(cust.id) : 0
  };
  ops.push({ s: 'sales', put: sale }, metaPut('counters', counters));
  if (cart.holdId && S.holds.has(cart.holdId)) ops.push({ s: 'holds', del: cart.holdId });
  return { ops, sale };
}

/* ---------- edit an existing bill (same number) ---------- */
function buildEdit(saleId, cart) {
  const old = S.sales.get(saleId);
  if (!old) throw new Error('Bill not found');
  if (old.void) throw new Error('This bill was cancelled and cannot be edited');
  if ((S.ix.retBySale.get(saleId) || []).length) throw new Error('This bill has returns, so it cannot be edited. Use Return instead.');
  const T = cartTotals(cart), ts = Date.now();
  const cust = cart.custId ? S.customers.get(cart.custId) : null;
  const lines = cleanLines(T);
  const oldQ = new Map(), newQ = new Map(), costOf = new Map();
  for (const l of old.lines) if (l.itemId) { oldQ.set(l.itemId, r2((oldQ.get(l.itemId) || 0) + l.qty)); costOf.set(l.itemId, l.cost); }
  for (const l of lines) if (l.itemId) { newQ.set(l.itemId, r2((newQ.get(l.itemId) || 0) + l.qty)); if (!costOf.has(l.itemId)) costOf.set(l.itemId, l.cost); }
  const ops = [];
  for (const itemId of new Set([...oldQ.keys(), ...newQ.keys()])) {
    const diff = r2((newQ.get(itemId) || 0) - (oldQ.get(itemId) || 0)); // + means more sold now
    if (!diff) continue;
    const it = S.items.get(itemId); if (!it) continue;
    const c = { ...it };
    if (diff < 0) addStock(c, -diff, costOf.get(itemId)); else c.qty = r2(num(c.qty) - diff);
    c.updated = ts;
    ops.push(putItem(c));
    ops.push(mv(ts, itemId, 'edit', -diff, { cost: costOf.get(itemId), ref: 'Bill #' + old.no, refId: saleId, party: cust ? cust.name : 'Walk-in', after: c.qty, note: diff > 0 ? 'More added to bill' : 'Taken off bill' }));
  }
  const sale = {
    ...old, custId: cust ? cust.id : null, custName: cust ? cust.name : 'Walk-in', custPhone: cust ? cust.phone || '' : '',
    lines, sub: T.sub, disc: T.disc, discLabel: cart.discMode === '%' && num(cart.disc) ? num(cart.disc) + '%' : '',
    deliv: T.deliv, total: T.total, tender: T.tender, recv: T.recv, change: T.change, credit: T.credit,
    method: cart.method || 'cash', note: (cart.note || '').trim(),
    prevBal: cust ? custBalance(cust.id, { before: old.ts, exclude: saleId }) : 0,
    edited: ts, editCount: (old.editCount || 0) + 1
  };
  ops.push({ s: 'sales', put: sale });
  if (cart.holdId && S.holds.has(cart.holdId)) ops.push({ s: 'holds', del: cart.holdId });
  return { ops, sale };
}

/* ---------- cancel (void) a bill ---------- */
function buildVoid(saleId, reason) {
  const s = S.sales.get(saleId);
  if (!s || s.void) throw new Error('Bill not found or already cancelled');
  if ((S.ix.retBySale.get(saleId) || []).length) throw new Error('This bill has returns. Return the remaining items instead of cancelling.');
  const ts = Date.now(), ops = [], items = new Map();
  for (const l of s.lines) {
    if (!l.itemId || !S.items.has(l.itemId)) continue;
    const it = items.get(l.itemId) || { ...S.items.get(l.itemId) };
    addStock(it, l.qty, l.cost); it.updated = ts; items.set(it.id, it);
    ops.push(mv(ts, it.id, 'void', l.qty, { cost: l.cost, ref: 'Bill #' + s.no, refId: s.id, party: s.custName, after: it.qty, note: reason || '' }));
  }
  for (const it of items.values()) ops.push(putItem(it));
  ops.push({ s: 'sales', put: { ...s, void: { ts, reason: reason || '' } } });
  return { ops };
}

/* ---------- returns ---------- */
function retInfo(saleId) {
  const s = S.sales.get(saleId);
  const qty = s.lines.map(() => 0), amt = s.lines.map(() => 0);
  const list = S.ix.retBySale.get(saleId) || [];

      it.qty -= l.qty; it.retQty += l.qty; it.sales -= l.amt; it.cost -= lc;

      c.sales -= l.amt; if (l.cond !== 'damaged') c.cost -= lc; d.sales -= l.amt; d.cost -= lc; d.ret += l.amt;
      if (l.cond === 'damaged') { R.dmgRet += lc; it.dmg += lc; d.dmg += lc; R.dmgList.push({ ts: r.ts, name: l.name, code: l.code, qty: l.qty, loss: r2(lc), why: 'Customer return (bill #' + r.saleNo + ')' + (r.note ? ' — ' + r.note : '') }); }
    }
  }
  for (const m of S.moves.values()) {
    if (!inR(m.day)) continue;
    if (m.type === 'damage') {
      const it = S.items.get(m.itemId) || { name: '(deleted item)', code: '' };
      const loss = -m.qty * num(m.cost);
      R.dmgStock += loss; D(m.day).dmg += loss;
      const e = I({ itemId: m.itemId, name: it.name, code: it.code }); e.dmg += loss;
      R.dmgList.push({ ts: m.ts, name: it.name, code: it.code, qty: -m.qty, loss: r2(loss), why: 'Damaged in shop' + (m.note ? ' — ' + m.note : '') });
    }
  }
  for (const p of S.payments.values()) if (inR(p.day)) { R.recovered += p.amount; addMoney(p.method, p.amount); }
  for (const e of S.expenses.values()) if (inR(e.day)) { R.expenses += e.amount; addMoney(e.method, -e.amount); D(e.day).exp += e.amount; R.expCats.set(e.cat, r2((R.expCats.get(e.cat) || 0) + e.amount)); }
  for (const si of S.stockins.values()) if (inR(si.day)) R.stockInValue += si.total;
  R.netSales = r2(R.sales - R.retAmt);
  R.netCogs = r2(R.cogs - R.retCost);
  R.damage = r2(R.dmgRet + R.dmgStock);
  R.grossProfit = r2(R.netSales - R.netCogs - R.damage);
  R.netProfit = r2(R.grossProfit - R.expenses);
  R.margin = R.netSales > 0 ? R.grossProfit / R.netSales * 100 : 0;
  R.moneyIn = r2(Object.values(R.money).reduce((a, b) => a + b, 0));
  for (const k of ['gross', 'disc', 'sales', 'cogs', 'deliv', 'retAmt', 'retCost', 'expenses', 'creditGiven', 'recovered', 'refundCash', 'refundAcct', 'stockInValue']) R[k] = r2(R[k]);
  R.billList.sort((a, b) => b.ts - a.ts);
  R.dmgList.sort((a, b) => b.ts - a.ts);
  return R;
}
function stockValue() {
  let cost = 0, sale = 0, qty = 0, low = 0, out = 0, count = 0;
  for (const it of S.items.values()) {
    if (it.active === false) continue;
    count++;
    const q = num(it.qty);
    if (q > 0) { cost += q * num(it.cost); sale += q * num(it.price); qty += q; }
    if (q <= 0) out++; else if (q <= lowLevel(it)) low++;
  }
  return { cost: r2(cost), sale: r2(sale), qty: r2(qty), low, out, count };
}
const lowLevel = it => it.low === '' || it.low == null ? num(S.settings.lowDefault) : num(it.low);
function itemStats(itemId) {
  const moves = [...S.moves.values()].filter(m => m.itemId === itemId).sort((a, b) => a.ts - b.ts);
  let sold = 0, revenue = 0, cost = 0, retQty = 0, dmgQty = 0, dmgLoss = 0, inQty = 0, inValue = 0, lastSold = 0, lastIn = 0;
  for (const s of S.sales.values()) {
    if (s.void) continue;
    s.lines.forEach((l, i) => {
      if (l.itemId !== itemId) return;
      sold += l.qty; revenue += l.netAmt; cost += l.cost * l.qty; if (s.ts > lastSold) lastSold = s.ts;
    });
  }
  for (const r of S.returns.values()) for (const l of r.lines) if (l.itemId === itemId) {
    sold -= l.qty; revenue -= l.amt; cost -= l.cost * l.qty; retQty += l.qty;
    if (l.cond === 'damaged') { dmgQty += l.qty; dmgLoss += l.qty * l.cost; }
  }
  for (const m of moves) {
    if (m.type === 'damage') { dmgQty += -m.qty; dmgLoss += -m.qty * num(m.cost); }
    if (m.type === 'in') { inQty += m.qty; inValue += m.qty * num(m.cost); if (m.ts > lastIn) lastIn = m.ts; }
  }
  return { moves, sold: r2(sold), revenue: r2(revenue), cost: r2(cost), profit: r2(revenue - cost - dmgLoss), retQty: r2(retQty), dmgQty: r2(dmgQty), dmgLoss: r2(dmgLoss), inQty: r2(inQty), inValue: r2(inValue), lastSold, lastIn };
}
function dataCheck() {
  const sum = new Map();
  for (const m of S.moves.values()) sum.set(m.itemId, r2((sum.get(m.itemId) || 0) + num(m.qty)));
  const bad = [];
  for (const it of S.items.values()) { const s = sum.get(it.id) || 0; if (Math.abs(s - num(it.qty)) > 1e-6) bad.push({ it, hist: s }); }
  const nos = new Map(); const dup = [];
  for (const s of S.sales.values()) { if (nos.has(s.no)) dup.push(s.no); nos.set(s.no, 1); }
  return { bad, dup };
}

/* ---------- search ---------- */
function searchItems(q, limit = 40) {
  q = lc(q).trim(); if (!q) return [];
  const toks = q.split(/\s+/);
  const out = [];
  for (const it of S.items.values()) {
    if (it.active === false) continue;
    const hay = lc(it.name + ' ' + it.code + ' ' + it.category + ' ' + it.brand + ' ' + placeText(it));
    if (!toks.every(t => hay.includes(t))) continue;
    const code = lc(it.code), name = lc(it.name);
    let score = 0;
    if (code && code === q) score = 100; else if (code.startsWith(q)) score = 60; else if (name.startsWith(q)) score = 40; else if (code.includes(q)) score = 30;
    out.push([score, it]);
  }
  out.sort((a, b) => b[0] - a[0] || lc(a[1].name).localeCompare(lc(b[1].name)));
  return out.slice(0, limit).map(x => x[1]);
}
function searchCustomers(q, limit = 30) {
  q = lc(q).trim(); const digits = q.replace(/\D/g, '');
  const out = [];
  for (const c of S.customers.values()) {
    if (c.active === false) continue;
    if (!q || lc(c.name).includes(q) || lc(c.city).includes(q) || (digits.length >= 3 && String(c.phone).replace(/\D/g, '').includes(digits))) out.push(c);
  }
  out.sort((a, b) => (lc(a.name).startsWith(q) ? 0 : 1) - (lc(b.name).startsWith(q) ? 0 : 1) || lc(a.name).localeCompare(lc(b.name)));
  return out.slice(0, limit);
}

/* ================= Online copy (Supabase) — shared by the shop POS and the phone page =================
   Talks straight to the shop's own free Supabase project over HTTPS (no extra libraries).
   The project link + publishable key are public by design; the data is protected by the owner's
   email + password and by row-level security (each row belongs to the signed-in owner). */
const CloudAPI = {
  KEY: 'shakeelpos:cloud', // {url, key, email, uid, access, refresh, exp}
  c: null,
  load() { try { this.c = JSON.parse(localStorage.getItem(this.KEY) || 'null'); } catch (e) { this.c = null; } return this.c; },
  save() { try { if (this.c) localStorage.setItem(this.KEY, JSON.stringify(this.c)); else localStorage.removeItem(this.KEY); } catch (e) { } },
  get on() { return !!(this.c && this.c.refresh); },
  cleanUrl(u) {
    u = String(u || '').trim().replace(/\/+$/, '');
    if (u && !/^https?:\/\//i.test(u)) u = 'https://' + u;
    return u.replace(/\/(rest|auth)\/v1.*$/i, '').replace(/\/+$/, '');
  },
  friendly(e) {
    const m = String(e && e.message || e);
    if (e && e.name === 'AbortError') return new Error('The internet is too slow or not working. Try again.');
    if (e instanceof TypeError || /failed to fetch|networkerror|load failed/i.test(m)) return Object.assign(new Error('No internet, or the project link is wrong.'), { net: true });
    if (/invalid login credentials/i.test(m)) return Object.assign(new Error('Wrong email or password.'), { status: 400 });
    if (/email not confirmed/i.test(m)) return Object.assign(new Error('This email is not confirmed yet. In Supabase, add the user again with "Auto Confirm User" ticked.'), { status: 400 });
    if (/invalid api key|no api key|apikey/i.test(m)) return Object.assign(new Error('The key is wrong. Copy the publishable (anon) key again from Supabase.'), { status: 401 });
    if (e && (e.code === 'PGRST205' || e.code === '42P01' || /could not find the table|relation .* does not exist/i.test(m))) return Object.assign(new Error('The tables are not made yet. Run the setup SQL in Supabase first (step 2).'), { status: 404, setup: true });
    return e instanceof Error ? e : new Error(m);
  },
  async http(path, o = {}) {
    const c = this.c, ctl = new AbortController(), t = setTimeout(() => ctl.abort(), o.timeout || 30000);
    const headers = Object.assign({ apikey: c.key, 'Content-Type': 'application/json' }, o.auth === false || !c.access ? {} : { Authorization: 'Bearer ' + c.access }, o.headers || {});
    try {
      const r = await fetch(c.url + path, { method: o.method || 'GET', headers, body: o.body === undefined ? undefined : JSON.stringify(o.body), signal: ctl.signal, cache: 'no-store' });
      const text = await r.text(); let data = null;
      try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; }
      if (!r.ok) {
        const e = new Error((data && (data.msg || data.message || data.error_description || data.error)) || ('HTTP ' + r.status));
        e.status = r.status; e.code = data && data.code; throw e;
      }
      return { data, headers: r.headers };
    } catch (e) { throw this.friendly(e); }
    finally { clearTimeout(t); }
  },
  setTokens(d) {
    this.c.access = d.access_token; this.c.refresh = d.refresh_token;
    this.c.exp = Date.now() + (num(d.expires_in) || 3600) * 1000;
    if (d.user && d.user.id) this.c.uid = d.user.id;
  },
  async signIn(url, key, email, password) {
    const c = { url: this.cleanUrl(url), key: String(key || '').trim(), email: String(email || '').trim().toLowerCase() };
    if (!/^https:\/\/.+/i.test(c.url) && !/^http:\/\/(127\.0\.0\.1|localhost)/i.test(c.url)) throw new Error('Paste the Project URL from Supabase (it starts with https://).');
    if (!c.key) throw new Error('Paste the publishable (anon) key from Supabase.');
    if (!c.email || !password) throw new Error('Type the email and password of the user you made in Supabase.');
    const old = this.c; this.c = c;
    try {
      const { data } = await this.http('/auth/v1/token?grant_type=password', { method: 'POST', auth: false, body: { email: c.email, password } });
      this.setTokens(data); this.save(); return this.c;
    } catch (e) { this.c = old; throw e; }
  },
  async fresh(force) { // makes sure the access token is valid (refreshes it about every hour)
    if (!this.on) throw Object.assign(new Error('Not signed in'), { login: true });
    if (!force && Date.now() < this.c.exp - 120e3) return;
    if (this._ref) return this._ref;
    this._ref = (async () => {
      try { const { data } = await this.http('/auth/v1/token?grant_type=refresh_token', { method: 'POST', auth: false, body: { refresh_token: this.c.refresh } }); this.setTokens(data); this.save(); }
      catch (e) { if (e.status === 400 || e.status === 401 || e.status === 403) { e.login = true; e.message = 'Signed out of the online copy. Sign in again.'; } throw e; }
      finally { this._ref = null; }
    })();
    return this._ref;
  },
  async api(path, o = {}) {
    await this.fresh();
    try { return await this.http('/rest/v1/' + path, o); }
    catch (e) { if (e.status === 401) { await this.fresh(true); return this.http('/rest/v1/' + path, o); } throw e; }
  },
  signOut() { this.c = null; this.save(); },
  linkCode() { return btoa(unescape(encodeURIComponent(JSON.stringify({ u: this.c.url, k: this.c.key, e: this.c.email })))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); },
  readCode(s) { try { const j = JSON.parse(decodeURIComponent(escape(atob(String(s).replace(/-/g, '+').replace(/_/g, '/'))))); return j && j.u && j.k ? j : null; } catch (e) { return null; } }
};
const fnv = s => { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); } return (h >>> 0).toString(36) + ':' + s.length.toString(36); };

/* the SQL the owner runs once in Supabase → SQL Editor (also shipped as cloud-setup.sql) */
const CLOUD_SQL = `-- Shakeel POS online copy: run once in Supabase > SQL Editor > New query > Run

/* ================= Shakeel POS — phone page =================
   Shows the shop PC's data from the owner's own Supabase project: today, stock, udhaar, bills, reports,
   parcels and parcel reminders. Read-only, except reminders (sent to the shop PC through pos_inbox).
   Uses the very same calculation code as the POS (core.js + logic.js), so numbers always match. */
S.settings = defaultSettings(); S.counters = defaultCounters(); S.notes = []; S.backup = {};
const PH = { tab: 'home', q: '', stockF: 'all', custQ: '', period: 'today', from: '', to: '', day: dayKey(), last: 0, synced: 0, loading: false, err: '', inbox: [], first: true, link: null };
const P_STATUS = { ready: ['Ready to send', 'a'], booked: ['Sent', ''], delivered: ['Delivered', 'g'], returned: ['Returned', 'r'] };
const TABS = [['home', '🏠', 'Today'], ['stock', '📦', 'Stock'], ['udhaar', '👥', 'Udhaar'], ['bills', '🧾', 'Bills'], ['reports', '📊', 'Reports']];

/* ---------- small helpers ---------- */
function toast(msg, cls) { const t = document.createElement('div'); t.className = 'toast ' + (cls || ''); t.textContent = msg; $('#toasts').appendChild(t); setTimeout(() => t.remove(), 2800); }
const ago = ts => { if (!ts) return 'never'; const m = Math.round((Date.now() - ts) / 60000); if (m < 1) return 'just now'; if (m < 60) return m + ' min ago'; const h = Math.round(m / 60); if (h < 24) return h + ' hour' + (h > 1 ? 's' : '') + ' ago'; return fmtDT(ts); };
const money = n => 'Rs ' + Math.round(+n || 0).toLocaleString('en-US');
const waLink = (phone, text) => 'https://wa.me/' + waPhone(phone) + '?text=' + encodeURIComponent(text);

/* ---------- local copy on the phone (opens fast, works with weak signal) ---------- */
const Cache = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      const rq = indexedDB.open('ShakeelPhone', 1);
      rq.onupgradeneeded = () => { rq.result.createObjectStore('rows'); rq.result.createObjectStore('meta'); };
      rq.onsuccess = () => { this.db = rq.result; res(this.db); };
      rq.onerror = () => rej(rq.error);
    });
  },
  tx(stores, mode, fn) { return new Promise((res, rej) => { const t = this.db.transaction(stores, mode); const out = fn(t); t.oncomplete = () => res(out); t.onerror = t.onabort = () => rej(t.error); }); },
  async all() {
    await this.open();
    return new Promise((res, rej) => { const out = [], cur = this.db.transaction('rows').objectStore('rows').openCursor(); cur.onsuccess = () => { const c = cur.result; if (c) { out.push(c.value); c.continue(); } else res(out); }; cur.onerror = () => rej(cur.error); });
  },
  async meta(k) { await this.open(); return new Promise(res => { const r = this.db.transaction('meta').objectStore('meta').get(k); r.onsuccess = () => res(r.result); r.onerror = () => res(undefined); }); },
  async setMeta(k, v) { await this.open(); return this.tx(['meta'], 'readwrite', t => t.objectStore('meta').put(v, k)); },
  async put(rows) { await this.open(); return this.tx(['rows'], 'readwrite', t => { const os = t.objectStore('rows'); for (const r of rows) { const k = r.store + '/' + r.id; if (r.deleted && r.store !== 'meta') os.delete(k); else os.put({ store: r.store, id: r.id, data: r.data }, k); } }); },
  async clear() { await this.open(); return this.tx(['rows', 'meta'], 'readwrite', t => { t.objectStore('rows').clear(); t.objectStore('meta').clear(); }); }
};
function applyRow(r) {
  if (r.store === 'meta') {
    if (r.deleted || !r.data) return;
    if (r.id === 'settings') S.settings = Object.assign(defaultSettings(), r.data);
    else if (r.id === 'counters') S.counters = Object.assign(defaultCounters(), r.data);
    else if (r.id === 'notes') S.notes = Array.isArray(r.data) ? r.data : [];
    return;
  }
  const m = S[r.store]; if (!(m instanceof Map)) return;
  if (r.deleted || !r.data) m.delete(r.id); else m.set(r.id, r.data);
}
async function loadCache() {
  const who = CloudAPI.c.url + '|' + CloudAPI.c.uid;
  if ((await Cache.meta('who')) !== who) { await Cache.clear(); await Cache.setMeta('who', who); }
  for (const r of await Cache.all()) applyRow(r);
  PH.last = (await Cache.meta('last')) || 0; PH.synced = (await Cache.meta('synced')) || 0;
  rebuildIndexes();
}
async function pull(quiet) {
  if (PH.loading || !CloudAPI.on) return;
  PH.loading = true; PH.err = ''; drawStatus();
  let got = 0;
  try {
    const since = new Date(Math.max(0, PH.last - 180e3)).toISOString(); // small overlap so nothing is missed
    let maxT = PH.last;
    for (let off = 0; ; off += 1000) {
      const { data } = await CloudAPI.api(`pos_records?select=store,id,data,deleted,updated_at&updated_at=gt.${encodeURIComponent(since)}&order=updated_at.asc,store.asc,id.asc&limit=1000&offset=${off}`, { timeout: 60000 });
      for (const r of data) { applyRow(r); const t = Date.parse(r.updated_at); if (t > maxT) maxT = t; }
      await Cache.put(data); got += data.length;
      if (data.length < 1000) break;
      drawStatus('Loading… ' + got);
    }
    const ib = await CloudAPI.api('pos_inbox?select=id,kind,text,ref,created_at&done=eq.false&order=created_at.asc');
    PH.inbox = ib.data || [];
    PH.last = maxT; PH.synced = Date.now();
    await Cache.setMeta('last', maxT); await Cache.setMeta('synced', PH.synced);
    rebuildIndexes();
  } catch (e) {
    PH.err = e.message;
    if (e.login) { CloudAPI.signOut(); PH.loading = false; return renderLogin('Please sign in again.'); }
    if (!quiet) toast(e.message, 'err');
  }
  PH.loading = false;
  if (got || PH.first || PH.inbox.length) { PH.first = false; renderPage(); } else drawStatus();
}

    const add = async () => {
      const i = $('#ntIn'), t = i.value.trim(); if (!t) return i.focus();
      const b = $('#ntAdd'); b.disabled = true;
      try { const { data } = await CloudAPI.api('pos_inbox?select=id,kind,text,ref,created_at', { method: 'POST', body: { kind: 'note', text: t.slice(0, 500) }, headers: { Prefer: 'return=representation' } }); PH.inbox.push(...(data || [])); toast('Reminder sent to the shop PC'); renderPage(); }
      catch (e) { toast(e.message, 'err'); b.disabled = false; }
    };
    $('#ntAdd').onclick = add;
    $('#ntIn').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); add(); } });
    $$('[data-done]').forEach(c => c.onchange = async () => {
      try { const { data } = await CloudAPI.api('pos_inbox?select=id,kind,text,ref,created_at', { method: 'POST', body: { kind: 'done', ref: c.dataset.done, text: '' }, headers: { Prefer: 'return=representation' } }); PH.inbox.push(...(data || [])); toast('Marked done'); renderPage(); }
      catch (e) { c.checked = false; toast(e.message, 'err'); }
    });
    $$('[data-del]').forEach(c => c.onchange = async () => {
      try { await CloudAPI.api('pos_inbox?id=eq.' + encodeURIComponent(c.dataset.del), { method: 'DELETE', headers: { Prefer: 'return=minimal' } }); PH.inbox = PH.inbox.filter(m => m.id !== c.dataset.del); renderPage(); }
      catch (e) { c.checked = false; toast(e.message, 'err'); }
    });
    bindRows();
  },
  stock() {
    $('#sq').addEventListener('input', debounce(e => { PH.q = e.target.value; renderPage(); }, 200));
    $$('[data-sf]').forEach(b => b.onclick = () => { PH.stockF = b.dataset.sf; renderPage(); });
    bindRows();
  },
  udhaar() { $('#cq').addEventListener('input', debounce(e => { PH.custQ = e.target.value; renderPage(); }, 200)); bindRows(); },
  bills() {
    $('#dPrev').onclick = () => { PH.day = addDays(PH.day, -1); renderPage(); };
    $('#dNext').onclick = () => { if (PH.day < dayKey()) { PH.day = addDays(PH.day, 1); renderPage(); } };
    $('#dPick').onchange = e => { if (e.target.value) { PH.day = e.target.value; renderPage(); } };
    bindRows();
  },
  reports() {
    $$('[data-p]').forEach(b => b.onclick = () => { PH.period = b.dataset.p; if (PH.period === 'custom' && !PH.from) { PH.from = addDays(dayKey(), -6); PH.to = dayKey(); } renderPage(); });
    if ($('#rF')) { $('#rF').onchange = e => { PH.from = e.target.value; renderPage(); }; $('#rT').onchange = e => { PH.to = e.target.value; renderPage(); }; }
  },
  stockval() { bindRows(); }
};
function bindRows() {
  $$('[data-it]').forEach(r => r.onclick = () => itemSheet(r.dataset.it));
  $$('[data-cu]').forEach(r => r.onclick = () => custSheet(r.dataset.cu));
  $$('[data-bill]').forEach(r => r.onclick = () => billSheet(r.dataset.bill));
}

/* ---------- start ---------- */
let started = false;
async function start() {
  frame(); await loadCache(); renderPage(); pull(true);
  if (started) return; started = true;
  setInterval(() => { if (document.visibilityState === 'visible') pull(true); }, 60e3);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pull(true); });
  window.addEventListener('online', () => pull(true));
}
(async () => {
  const code = new URLSearchParams(location.hash.slice(1)).get('c');
  if (code) {
    PH.link = CloudAPI.readCode(code);
    history.replaceState(null, '', location.pathname + location.search); // keep the address bar clean
    if (PH.link) { try { localStorage.setItem('shakeelpos:link', JSON.stringify(PH.link)); } catch (e) { } }
  }
  CloudAPI.load();
  if (PH.link && CloudAPI.on && (CloudAPI.c.url !== CloudAPI.cleanUrl(PH.link.u) || CloudAPI.c.key !== PH.link.k)) { CloudAPI.signOut(); await Cache.clear().catch(() => { }); } // a link for another shop
  if (!CloudAPI.on) return renderLogin();
  await start();
})();
</script>
